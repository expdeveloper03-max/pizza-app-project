 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Haven - Order Online</title>
    <link rel="stylesheet" href="pizza.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Pizza<span>Slice</span></div>

        <nav class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="menu.html">Menu</a>
            <a href="deals.html">Deals</a>
            <a href="trackorders.html">Track Orders</a>
        </nav>
    </header>

    <main class="hero container">
        <section class="hero-content">
            <h1>Book Unforgettable Flavors</h1>
            <p class="subtitle">
                Compare crusts, toppings, and deals from local pizzerias across the city
            </p>

            <form class="search-box" action="#">
                <span class="search-icon" aria-hidden="true"></span>
                <input type="text" name="query" placeholder="Search pizzas, toppings, ingredients, or deals...">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </section>

        <section class="explore-section">
            <h2>What do you want to explore?</h2>

            <div class="category-grid">
                <div class="category-card">
                    <img src="ppppp.webp" alt="Classic and Traditional Pizzas">
                    <div class="card-overlay">
                        <span>Classic and Traditional</span>
                        <div class="arrow-btn"></div>
                    </div>
                </div>

                <div class="category-card">
                    <img src="pizz.jpg" alt="Gourmet and Signature Pizzas">
                    <div class="card-overlay">
                        <span>Gourmet and Signature</span>
                        <div class="arrow-btn"></div>
                    </div>
                </div>

                <div class="category-card">
                    <img src="Deep-Dish-Pizza-1200-x-1200.jpg" alt="Deep Dish and Pan Pizzas">
                    <div class="card-overlay">
                        <span>Deep Dish and Pan</span>
                        <div class="arrow-btn"></div>
                    </div>
                </div>

                <div class="category-card">
                    <img src="Meat-Lovers-Pizza-8.jpeg" alt="Meat Lovers Feast">
                    <div class="card-overlay">
                        <span>Meat Lovers Feast</span>
                        <div class="arrow-btn"></div>
                    </div>
                </div>

                <div class="category-card">
                    <img src="images (1).jpg" alt="Veggie and Plant-Based Options">
                    <div class="card-overlay">
                        <span>Veggie and Plant-Based</span>
                        <div class="arrow-btn"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
